# DocPilot services for the laptop (Phase 3). Start: docker compose up -d   Stop: docker compose down
# Step 3.1: Qdrant. Step 3.1b: SeaweedFS (S3-compatible object storage) + MLflow server.
# Keys come from .env (S3_ACCESS_KEY, S3_SECRET_KEY): never written in this file.
services:
  qdrant:
    # Exact tag, never "latest": same version as qdrant-client 1.19.1 (requirements.txt).
    # Checked on Docker Hub 2026-10-21: v1.19.1 has amd64 AND arm64 builds (AWS x86, Oracle
    # ARM, D-050).
    image: qdrant/qdrant:v1.19.1
    ports:
      # host:container. REST API + web dashboard: http://localhost:6333/dashboard
      # 127.0.0.1 = reachable from this laptop only, not from other machines on the Wi-Fi.
      - "127.0.0.1:6333:6333"
    volumes:
      # A named Docker volume (see the end of this file): survives "docker compose down"
      # and restarts. Not a laptop folder: those sit in OneDrive here, which tried to sync
      # 1.2 GB of index files, and Docker reads Windows folders slowly (D-051).
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  seaweedfs:
    # Object storage with the Amazon S3 API (D-019: MinIO community edition was archived).
    # Checked on Docker Hub 2026-10-21: 4.48 (2026-09-28) has amd64 AND arm64 builds.
    image: chrislusf/seaweedfs:4.48
    # "server" = master + volume + filer in one container; "-s3" adds the S3 gateway (8333).
    # volumeSizeLimitMB: each bucket reserves volumes; 30 GB each by default is too big here.
    command: "server -dir=/data -s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024"
    environment:
      # With no -s3.config file, SeaweedFS takes its one S3 user from these two variables.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333" # S3 API, laptop only
    volumes:
      - seaweed_data:/data # named volume: buckets survive restarts
    restart: unless-stopped

  mlflow:
    # The lab notebook as a server: runs + metrics in SQLite (in ./mlflow_server), artifact
    # FILES in the SeaweedFS bucket docpilot-mlflow. --serve-artifacts: Python clients send
    # files through MLflow, so only this container needs the S3 keys.
    build: ./docker/mlflow
    image: docpilot-mlflow:3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://docpilot-mlflow
      --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333 # containers reach each other by name
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:5000:5000" # UI + API: http://127.0.0.1:5000
    volumes:
      - mlflow_data:/mlflow # named volume: the SQLite file with runs and metrics
    depends_on:
      - seaweedfs
    restart: unless-stopped

# Named volumes live inside Docker's own disk. List: docker volume ls
# Delete ALL DocPilot data (careful): docker compose down -v
volumes:
  qdrant_data:
  seaweed_data:
  mlflow_data:
