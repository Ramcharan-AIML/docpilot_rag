# Project settings for DocPilot.
# Dependencies are NOT listed here: requirements.txt (runtime) and
# requirements-dev.txt (tools) are the single source of truth, with exact pins.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpilot"
version = "0.1.0"
description = "Agentic, hybrid-search RAG assistant over technical documentation"
readme = "README.md"
# numpy 2.5 (our pinned version) needs Python 3.12+. See decision D-015.
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]           # code lives in src/docpilot (decision D-013)

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds teaching sketches inside Markdown (plans for later phases, aligned comments);
# they are not code we run, so the formatter must not rewrite them (D-035).
# tests/fixtures/: the CI gate's pages must stay byte-for-byte as written, or its scores
# move (ruff reformatted a code example inside one on 2026-10-20; D-048).
# evals/spot_checks/: records of what the LLM answered (code blocks included); a human
# judges them as written (CI failed on one, 2026-10-22, PR #4).
extend-exclude = ["docs", "tests/fixtures", "evals/spot_checks"]

[tool.ruff.lint]
# E/F: real errors and unused names. I: sorted imports.
# B: common bug patterns. UP: modern Python syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on the import path so tests can import evals/*.py
# (evals/ is a tool folder, not part of the installed docpilot package).
pythonpath = ["."]

[tool.pyrefly]
# The VS Code type checker: look in src/ (docpilot) AND the project root (evals/),
# the same import roots Python and pytest use. Checked on pyrefly.org 2026-10-14.
search-path = [".", "src"]
