# CD: build the server image and push it to GHCR (Phase 7 B5, D-067).
# Teaching: docs/production/05_teach_cicd_ghcr.md
# Runs ONLY after the "ci" workflow (tests + eval gate) SUCCEEDED on main, on that exact
# commit, so a broken commit never becomes an image. Also a manual "Run workflow" button.
# Action versions checked on GitHub releases 2026-10-24: checkout v7.0.1,
# setup-buildx v4.4.1, login v4.6.0 (v4.7.0 was 1 day old: skipped), metadata v6.2.0,
# build-push v7.4.0.
name: image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write packages. Nothing else.
permissions:
  contents: read
  packages: write

# Two merges close together: build one after the other, never in parallel.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # first build installs torch (about 10 min); cached builds are faster
    steps:
      # workflow_run: the commit CI tested (head_sha). Manual run: the branch's newest commit.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Buildx = Docker's builder; needed for the GitHub layer cache below.
      - uses: docker/setup-buildx-action@v4.4.1

      # GITHUB_TOKEN: made for this run only, deleted after it. No secret to create.
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<commit> (the server pins THIS) + latest. context: git = take the commit
      # from the checkout above. Also adds labels, e.g. org.opencontainers.image.source,
      # which links the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          context: git
          images: ghcr.io/ramcharan-aiml/docpilot # lowercase: a Docker rule
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # linux/amd64 only: the AWS t3.small is Intel/AMD. ARM (Oracle, later) would build
      # through an emulator and take very long. type=gha = keep layers in GitHub's cache,
      # so a code-only change does not reinstall torch.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
